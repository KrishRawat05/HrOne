<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f3ed">
  <title>Daymark | Workforce</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="Daymark home">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span class="brand-name">daymark<span>workforce</span></span>
      </a>

      <div class="nav-caption">WORKSPACE</div>
      <nav class="primary-nav" aria-label="Primary navigation">
        <button class="nav-item is-active" data-view="overview"><span class="nav-icon" aria-hidden="true">◫</span>Overview</button>
        <button class="nav-item" data-view="attendance"><span class="nav-icon" aria-hidden="true">◷</span>Attendance</button>
        <button class="nav-item" data-view="employees"><span class="nav-icon" aria-hidden="true">♙</span>Employees</button>
        <button class="nav-item" data-view="analytics"><span class="nav-icon" aria-hidden="true">⌁</span>Analytics</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="service-indicator"><span class="service-dot"></span><span id="service-label">Checking service</span></div>
        <a class="api-link" href="/docs" target="_blank" rel="noreferrer">API reference <span aria-hidden="true">↗</span></a>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span>PEOPLE OPERATIONS</span><span class="crumb-slash">/</span><strong id="current-section">Overview</strong></div>
        <div class="topbar-right"><span class="today-label" id="today-label"></span><span class="avatar" aria-label="Administrator">A</span></div>
      </header>
      <main id="view-root" tabindex="-1" aria-live="polite">
        <div class="loading-state"><span class="loader"></span>Loading workforce data</div>
      </main>
    </div>
  </div>

  <dialog id="action-dialog" class="dialog-shell" aria-labelledby="dialog-title">
    <form method="dialog" class="dialog-dismiss"><button class="icon-button" aria-label="Close dialog">×</button></form>
    <div id="dialog-content"></div>
  </dialog>
  <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
</body>
</html>
